version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/"
    schema: "internal/db/migrations/"
    gen:
      go:
        package: "generated"
        out: "internal/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        overrides:
          - db_type: "jsonb"
            go_type:
              type: "RawMessage"
              import: "encoding/json"
          # Column-level overrides: sqlc's global jsonb rule misses columns on
          # partitioned tables, so they emit as []byte and Go base64-encodes
          # them over the JSON API. Pin each to json.RawMessage.
          - column: "events.stacktrace"
            go_type: { type: "RawMessage", import: "encoding/json" }
          - column: "events.payload"
            go_type: { type: "RawMessage", import: "encoding/json" }
          - column: "logs.attributes"
            go_type: { type: "RawMessage", import: "encoding/json" }
          - column: "spans.attributes"
            go_type: { type: "RawMessage", import: "encoding/json" }
          - column: "metrics.labels"
            go_type: { type: "RawMessage", import: "encoding/json" }
