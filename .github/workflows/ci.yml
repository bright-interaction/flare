# CI for the public fair-code repo.
#
# THIS FILE IS DELIBERATELY THIN. Every actual check lives in scripts/ci.sh, which you
# can run yourself:
#
#   bash scripts/ci.sh
#
# Two reasons for the split. A contributor can reproduce CI locally instead of
# discovering a failure after pushing. And this repository is a filtered mirror
# published by a job that authenticates with a repository deploy key, which GitHub does
# not permit to create or update anything under .github/workflows/. Keeping the steps
# out of this file means a change to a check no longer breaks the publish at its final
# push, after every gate has already passed.
#
# So: edit scripts/ci.sh freely. Editing THIS file is a rare, deliberate act (an action
# version bump, a trigger change) and needs a push from a credential holding the
# `workflow` scope.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # scripts/ci.sh runs the frontend deps, typecheck and build. Without bun on
      # the runner all three report SKIPPED, which is honest but means the UI the
      # binary embeds is never checked on a pull request.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: All checks (build, vet, test, gofmt, licenses, secrets, vulnerabilities)
        run: bash scripts/ci.sh
