apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flare.fullname" . }}
  labels:
    {{- include "flare.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "flare.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flare.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: flare
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "8080"
            - name: BASE_URL
              value: {{ .Values.baseURL | quote }}
            - name: RETENTION_DAYS
              value: {{ .Values.retentionDays | quote }}
            {{- if .Values.allowDropWithoutExport }}
            - name: FLARE_ALLOW_DROP_WITHOUT_EXPORT
              value: "true"
            {{- end }}
            - name: FLARE_PARQUET_DIR
              value: /app/data/parquet
            - name: SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" . }}
                  key: session-key
            - name: CSRF_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" . }}
                  key: csrf-key
            - name: FLARE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" . }}
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" . }}
                  key: database-url
            {{- if .Values.smtp.host }}
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USER
              value: {{ .Values.smtp.user | quote }}
            - name: SMTP_FROM
              value: {{ .Values.smtp.from | quote }}
            - name: SMTP_FROM_NAME
              value: {{ .Values.smtp.fromName | quote }}
            - name: SMTP_TLS
              value: {{ .Values.smtp.tls | quote }}
            {{- if .Values.smtp.password }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "flare.secretName" . }}
                  key: smtp-password
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "flare.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "flare.fullname" . }}-data
  labels:
    {{- include "flare.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
