{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flare.fullname" . }}
  labels:
    {{- include "flare.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-key: {{ required "secrets.sessionKey is required (or set secrets.existingSecret)" .Values.secrets.sessionKey | quote }}
  csrf-key: {{ required "secrets.csrfKey is required (32 bytes)" .Values.secrets.csrfKey | quote }}
  secret-key: {{ required "secrets.secretKey is required (encrypts integration secrets at rest; production refuses to boot without it)" .Values.secrets.secretKey | quote }}
  database-url: {{ include "flare.databaseURL" . | quote }}
  {{- if .Values.smtp.password }}
  smtp-password: {{ .Values.smtp.password | quote }}
  {{- end }}
{{- end }}
