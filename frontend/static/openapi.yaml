openapi: 3.1.0
info:
  title: Flare API
  version: "1.0"
  description: >
    Flare is a sovereign, self-hostable observability backend (errors, logs,
    traces). Send data with any Sentry SDK (change only the DSN) or over OTLP;
    manage projects, issues, releases and source maps with an org API key.
  license:
    name: AGPL-3.0
servers:
  - url: https://flare.example.com
    description: Hosted
  - url: http://localhost:8080
    description: Self-host (default)
tags:
  - name: Ingest
    description: Send events, logs and traces. Authenticated by the DSN public key.
  - name: Projects
    description: Manage projects and their DSNs.
  - name: Issues
    description: Grouped errors, their events, status and GitHub linking.
  - name: Releases
    description: Track releases and mark deploys.
  - name: Source maps
    description: Upload source maps so minified stack traces resolve to original source.
  - name: Alerts
    description: Alert rules and notification channels.
  - name: Team
    description: Members, invitations and the audit log.
  - name: Integrations
    description: GitHub and OIDC single sign-on configuration.
  - name: Auth
    description: Session authentication for the dashboard.
  - name: System
    description: Health and data export.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >
        Org-scoped API key (Bearer). Create one in Settings. Acts at member
        level: manage projects, issues, releases, source maps; not team admin.
    sentryKey:
      type: apiKey
      in: query
      name: sentry_key
      description: The DSN public key, for Sentry-wire ingest.
    flareKey:
      type: apiKey
      in: header
      name: X-Flare-Key
      description: The DSN public key, for OTLP and native ingest.
    session:
      type: apiKey
      in: cookie
      name: session
      description: Browser session cookie (dashboard only; requires CSRF on writes).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Project:
      type: object
      properties:
        id: { type: string, description: cuid primary key }
        name: { type: string }
        slug: { type: string }
        platform: { type: string }
        dsn: { type: string, description: "Sentry-compatible DSN; the path segment is a numeric project id SDKs accept" }
        otlp_endpoint: { type: string }
    Issue:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        culprit: { type: string }
        level: { type: string, enum: [debug, info, warning, error, fatal] }
        status: { type: string, enum: [unresolved, resolved, ignored] }
        platform: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        event_count: { type: integer }
        first_release: { type: string }
        github_url: { type: string }
    Event:
      type: object
      properties:
        id: { type: string }
        level: { type: string }
        message: { type: string }
        exception_type: { type: string }
        exception_value: { type: string }
        platform: { type: string }
        environment: { type: string }
        release: { type: string }
        received_at: { type: string, format: date-time }
        stacktrace:
          type: object
          properties:
            frames:
              type: array
              items:
                type: object
                properties:
                  filename: { type: string }
                  function: { type: string }
                  lineno: { type: integer }
                  colno: { type: integer }
                  in_app: { type: boolean }
                  context_line: { type: string }
                  pre_context: { type: array, items: { type: string } }
                  post_context: { type: array, items: { type: string } }
                  symbolicated: { type: boolean }
    Release:
      type: object
      properties:
        version: { type: string }
        created_at: { type: string, format: date-time }
        new_issues: { type: integer }
    AlertRule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [new_issue, regression, spike] }
        threshold: { type: integer, description: "events (spike only)" }
        window_minutes: { type: integer, description: "window (spike only)" }
        enabled: { type: boolean }
    Artifact:
      type: object
      properties:
        id: { type: string }
        release: { type: string }
        name: { type: string, description: "the minified file the map applies to" }
        size: { type: integer }
        created_at: { type: string, format: date-time }
paths:
  /api/health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200": { description: OK }
  /api/{projectID}/envelope:
    post:
      tags: [Ingest]
      summary: Sentry envelope ingest
      description: >
        The endpoint modern @sentry/* SDKs post to. Point an SDK at Flare by
        changing only the DSN host; no code changes. Accepts the Sentry
        envelope format (newline-delimited JSON).
      security: [{ sentryKey: [] }]
      parameters:
        - name: projectID
          in: path
          required: true
          schema: { type: string }
          description: The numeric project id from the DSN.
      requestBody:
        required: true
        content:
          application/x-sentry-envelope:
            schema: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string } } }
        "401": { description: invalid ingest key, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /api/{projectID}/store:
    post:
      tags: [Ingest]
      summary: Single event ingest (Sentry /store/)
      security: [{ sentryKey: [] }]
      parameters:
        - { name: projectID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
            example:
              level: error
              platform: node
              release: "1.4.2"
              exception:
                values:
                  - type: TypeError
                    value: "cannot read 'id' of undefined"
                    stacktrace: { frames: [{ filename: app.js, function: handler, lineno: 42 }] }
      responses:
        "200": { description: Accepted, content: { application/json: { schema: { type: object, properties: { id: { type: string } } } } } }
  /api/{projectID}/logs:
    post:
      tags: [Ingest]
      summary: Native structured log ingest
      security: [{ flareKey: [] }]
      parameters:
        - { name: projectID, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    type: object
                    properties:
                      severity: { type: string }
                      body: { type: string }
                      trace_id: { type: string }
                      attributes: { type: object }
      responses:
        "200": { description: Accepted }
  /otlp/v1/logs:
    post:
      tags: [Ingest]
      summary: OTLP logs (protobuf or JSON)
      security: [{ flareKey: [] }]
      requestBody:
        content:
          application/x-protobuf: { schema: { type: string, format: binary } }
          application/json: { schema: { type: object } }
      responses:
        "200": { description: Accepted }
  /otlp/v1/traces:
    post:
      tags: [Ingest]
      summary: OTLP traces (protobuf or JSON)
      security: [{ flareKey: [] }]
      requestBody:
        content:
          application/x-protobuf: { schema: { type: string, format: binary } }
          application/json: { schema: { type: object } }
      responses:
        "200": { description: Accepted }
  /api/projects:
    get:
      tags: [Projects]
      summary: List projects
      security: [{ apiKey: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Project" } } } } }
    post:
      tags: [Projects]
      summary: Create a project
      security: [{ apiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                platform: { type: string }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
  /api/projects/provision:
    post:
      tags: [Projects]
      summary: Get-or-create a project by slug (idempotent)
      description: Safe to call on every deploy; keyed by a stable slug. Used by Cloud auto-wiring.
      security: [{ apiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                slug: { type: string }
                platform: { type: string }
      responses:
        "200": { description: Existing project, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Get a project
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { description: Not found }
    delete:
      tags: [Projects]
      summary: Delete a project and all its telemetry
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
  /api/projects/{id}/issues:
    get:
      tags: [Issues]
      summary: List issues for a project
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unresolved, resolved, ignored] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues: { type: array, items: { $ref: "#/components/schemas/Issue" } }
                  total: { type: integer }
  /api/issues/{id}:
    get:
      tags: [Issues]
      summary: Get an issue
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
    patch:
      tags: [Issues]
      summary: Update issue status
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { status: { type: string, enum: [unresolved, resolved, ignored] } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Issue" } } } }
  /api/issues/{id}/events:
    get:
      tags: [Issues]
      summary: List an issue's recent events (with symbolicated stack traces)
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
  /api/issues/{id}/github:
    post:
      tags: [Issues]
      summary: Open a GitHub issue from this issue
      description: Requires GitHub configured for the org. Idempotent - returns the existing link if already created.
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object, properties: { github_url: { type: string } } } } } }
        "200": { description: Already linked }
  /api/projects/{id}/releases:
    get:
      tags: [Releases]
      summary: List releases (with new-issue counts)
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Release" } } } } }
    post:
      tags: [Releases]
      summary: Mark a deploy (register a release)
      description: Idempotent on (project, version). Call from CI on deploy.
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [version], properties: { version: { type: string } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Release" } } } }
  /api/projects/{id}/artifacts:
    get:
      tags: [Source maps]
      summary: List uploaded source maps
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
    post:
      tags: [Source maps]
      summary: Upload a source map for a release
      description: name is the minified file (e.g. app.min.js); content is the .map JSON. Call from CI after a build.
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [release, name, content]
              properties:
                release: { type: string }
                name: { type: string }
                content: { type: string, description: "the .map file contents" }
      responses:
        "201": { description: Uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/Artifact" } } } }
  /api/projects/{id}/artifacts/{artifactID}:
    delete:
      tags: [Source maps]
      summary: Delete a source map
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: artifactID, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /api/projects/{id}/logs:
    get:
      tags: [Projects]
      summary: Search logs
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string } }
      responses:
        "200": { description: OK }
  /api/projects/{id}/traces:
    get:
      tags: [Projects]
      summary: List traces
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
  /api/projects/{id}/traces/{traceID}:
    get:
      tags: [Projects]
      summary: Get a trace's spans (waterfall)
      security: [{ apiKey: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: traceID, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /api/projects/{id}/alert-rules:
    get:
      tags: [Alerts]
      summary: List alert rules
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AlertRule" } } } } }
    post:
      tags: [Alerts]
      summary: Create an alert rule
      security: [{ apiKey: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string }
                type: { type: string, enum: [new_issue, regression, spike] }
                threshold: { type: integer, description: "spike: min events" }
                window_minutes: { type: integer, description: "spike: window" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } }
  /api/channels:
    get:
      tags: [Alerts]
      summary: List notification channels
      security: [{ apiKey: [] }]
      responses: { "200": { description: OK } }
    post:
      tags: [Alerts]
      summary: Create a notification channel
      description: "type: log | email | slack | webhook, with the matching config."
      security: [{ apiKey: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [log, email, slack, webhook] }
                config: { type: object }
            examples:
              slack: { value: { type: slack, config: { webhook_url: "https://hooks.slack.com/services/..." } } }
              email: { value: { type: email, config: { to: "alerts@team.com" } } }
      responses: { "201": { description: Created } }
  /api/members:
    get:
      tags: [Team]
      summary: List members
      security: [{ apiKey: [] }, { session: [] }]
      responses: { "200": { description: OK } }
  /api/audit-log:
    get:
      tags: [Team]
      summary: Audit log (admin)
      security: [{ session: [] }]
      responses: { "200": { description: OK }, "403": { description: admin only } }
  /api/export:
    get:
      tags: [System]
      summary: Export the workspace's structured data (admin)
      security: [{ session: [] }]
      responses: { "200": { description: JSON bundle } }
  /api/keys:
    get:
      tags: [Team]
      summary: List API keys
      security: [{ session: [] }]
      responses: { "200": { description: OK } }
    post:
      tags: [Team]
      summary: Create an API key (plaintext shown once)
      security: [{ session: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string } } } } }
      responses: { "201": { description: Created } }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register the first user (becomes owner) / a new workspace
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string, minLength: 8 }, org_name: { type: string } } }
      responses: { "200": { description: Registered + signed in } }
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      security: []
      requestBody:
        content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } } } }
      responses: { "200": { description: OK }, "401": { description: invalid credentials } }
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ session: [] }]
      responses: { "200": { description: OK }, "401": { description: not authenticated } }
