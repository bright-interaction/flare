# gitleaks config for Flare (used by the public-mirror publish gate and any local
# scan). Extends the default ruleset, then allowlists documentation/config-example
# PLACEHOLDERS: .env.example and test fixtures use obvious change-me markers, never
# real secrets. A real leaked credential would not carry these markers, so it is
# still caught; only the placeholders are suppressed.
title = "flare"

[extend]
useDefault = true

[allowlist]
description = "Config/test placeholders use obvious markers, not real secrets"
regexes = [
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''_change_me''',
  '''_here_''',
  '''EXAMPLE''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''0123456789abcdef''',
]
# These are unit-test fixtures for the AI PII scrubber and the sensitive-data
# detector: their whole purpose is to carry SYNTHETIC gcp/stripe/jwt secrets so
# the tests can assert the scrubber redacts them. Not real credentials.
paths = [
  '''internal/ai/ai_test\.go''',
  '''internal/api/sensitive_test\.go''',
]
