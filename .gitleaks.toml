# gitleaks config for Flare (used by the public-mirror publish gate and any local
# scan). Extends the default ruleset, then allowlists PLACEHOLDERS by MARKER.
#
# The previous shape had two allowlists that were both broader than the thing
# they excused, and they are the same mistake twice:
#
#  1. The placeholder markers were global and un-path-scoped, so any finding
#     anywhere whose secret contained "EXAMPLE", "_here_", "changeme",
#     "your_*" or "0123456789abcdef" was suppressed. That is the "allowlist
#     shipped with the offenders in it" shape.
#  2. internal/ai/ai_test.go and internal/api/sensitive_test.go were exempt BY
#     PATH, entire files. Those are exactly the files where somebody
#     reproducing a production leak pastes the real credential to see whether
#     the scrubber catches it, and they publish to the mirror.
#
# The fix is to key on the marker and drop `paths` entirely.
#
# `paths` is not used here on purpose. gitleaks v8.30.0 resolves `paths` and
# `regexes` as OR even with condition = "AND": measured by planting an unmarked
# `live_EXAMPLE_NOT_A_REAL_KEY` in an allowlisted test file and watching the scan
# report clean. Listing a path would therefore restore exactly the whole-file
# exemption this config exists to remove.
#
# So a placeholder has to SAY it is a placeholder, on its own line, and an
# unmarked credential is reported wherever it is pasted, including inside the
# scrubber's own tests. scripts/test-gitleaks-allowlist.sh plants one and
# asserts the refusal.
title = "flare"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders and marked synthetic fixtures"
regexTarget = "line"
regexes = [
  # Config-example placeholders.
  '''changeme''',
  '''change[_-]?me''',
  '''your_[a-z0-9_]*''',
  '''_here''',
  '''(?i)example''',
  '''dev-[a-z]+-key-not-for-production''',
  # Test-fixture markers. Each is either an explicit label or a value distinctive
  # enough that a real credential will not carry it.
  '''(?i)synthetic''',
  '''(?i)fixture''',
  '''(?i)not-?a-?real''',
  '''AbCdEfGhIjKlMnOpQrSt''',
  '''(?i)sIgNaTuRe''',
  '''(?i)supersecret''',
  '''(?i)hunter2''',
  '''(?i)victim''',
  '''4111111111111111''',
  '''0123456789abcdef''',
]
